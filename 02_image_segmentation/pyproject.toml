[project]
name = "image-segmentation"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "imageio==2.37.4",
    "ipykernel==7.3.0",
    "matplotlib==3.11.2",
    "numpy==2.5.3",
    "opencv-python==5.0.0.93",
    "scikit-image==0.26.0",
    "torch==2.14.0+cpu",
    "torchvision==0.29.0+cpu",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.uv]
package = false
